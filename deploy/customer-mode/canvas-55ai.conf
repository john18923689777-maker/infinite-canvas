log_format canvas_redacted '$request_method $uri $status $body_bytes_sent $request_time';

server {
    listen 443 ssl http2;
    server_name canvas.55ai.xyz;
    root /usr/share/nginx/html;

    client_max_body_size 268435456;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    add_header Content-Security-Policy "frame-ancestors https://55ai.xyz" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location /v1/ {
        proxy_pass https://55ai.xyz;
        proxy_ssl_server_name on;
        proxy_ssl_name 55ai.xyz;
        proxy_set_header Host 55ai.xyz;
        proxy_pass_request_headers off;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header x-goog-api-key $http_x_goog_api_key;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $http_content_length;
        proxy_set_header Accept $http_accept;
        proxy_set_header Cookie "";
        proxy_set_header X-API-Key "";
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location /v1beta/ {
        proxy_pass https://55ai.xyz;
        proxy_ssl_server_name on;
        proxy_ssl_name 55ai.xyz;
        proxy_set_header Host 55ai.xyz;
        proxy_pass_request_headers off;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header x-goog-api-key $http_x_goog_api_key;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $http_content_length;
        proxy_set_header Accept $http_accept;
        proxy_set_header Cookie "";
        proxy_set_header X-API-Key "";
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3311;
        proxy_set_header Host $host;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        access_log /var/log/nginx/canvas-55ai.access.log canvas_redacted;
    }
}
