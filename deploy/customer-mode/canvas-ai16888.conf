server {
    listen 80;
    server_name sub.ai16888.com.cn;
    return 301 https://sub.ai16888.com.cn$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sub.ai16888.com.cn;
    ssl_certificate /etc/letsencrypt/live/sub.ai16888.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.ai16888.com.cn/privkey.pem;
    root /usr/share/nginx/html;
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types application/javascript text/css application/json image/svg+xml;

    client_max_body_size 268435456;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    add_header Content-Security-Policy "frame-ancestors https://sub2.ai16888.com.cn" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log /var/log/nginx/canvas-ai16888.access.log canvas_redacted;

    location /v1/ {
        proxy_pass https://sub2.ai16888.com.cn;
        proxy_ssl_server_name on;
        proxy_ssl_name sub2.ai16888.com.cn;
        proxy_set_header Host sub2.ai16888.com.cn;
        proxy_pass_request_headers off;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header x-goog-api-key $http_x_goog_api_key;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $http_content_length;
        proxy_set_header Accept $http_accept;
        proxy_set_header Cookie "";
        proxy_set_header X-API-Key "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
    }

    location /v1beta/ {
        proxy_pass https://sub2.ai16888.com.cn;
        proxy_ssl_server_name on;
        proxy_ssl_name sub2.ai16888.com.cn;
        proxy_set_header Host sub2.ai16888.com.cn;
        proxy_pass_request_headers off;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header x-goog-api-key $http_x_goog_api_key;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $http_content_length;
        proxy_set_header Accept $http_accept;
        proxy_set_header Cookie "";
        proxy_set_header X-API-Key "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:3312;
        proxy_set_header Host $host;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Cache-Control;
        add_header Content-Security-Policy "frame-ancestors https://sub2.ai16888.com.cn" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3312;
        proxy_set_header Host $host;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
    }
}
